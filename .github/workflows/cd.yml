name: CD

# Dispara en cada push a main (i.e. cada PR mergeado, dado que main esta
# protegida contra push directo) y tambien admite dispatch manual para un
# redeploy puntual sin cambios de codigo. `concurrency` serializa los runs
# para que un segundo merge durante un deploy en curso quede en cola en vez
# de correr en paralelo contra la misma VM.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lgurrieri/logsentinel-backend

jobs:
  build-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8026d2bc3645ea78b0d2544766a1225eb5691f89  # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install and build
        working-directory: frontend
        env:
          # Vacio a proposito: nginx sirve el frontend y proxea /api/ al backend
          # en el MISMO origen -- las llamadas fetch/EventSource quedan
          # relativas (`/api/v1/...`) en vez de apuntar a localhost:8080.
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: [build-push-backend, build-frontend]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Azure login (OIDC federado, sin secret de larga vida)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Empaquetar y subir el bundle de deploy al Storage Account
        run: |
          tar czf bundle.tar.gz docker-compose.yml docker-compose.prod.yml IaC/nginx/nginx.conf frontend/dist
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name deploy-bundle \
            --name "bundle-${{ github.sha }}.tar.gz" \
            --file bundle.tar.gz \
            --overwrite

      - name: Desplegar en la VM vía az vm run-command (sin SSH)
        env:
          IMAGE_TAG: ${{ needs.build-push-backend.outputs.image_tag }}
        run: |
          cat > remote-deploy.sh <<'SCRIPT'
          set -euo pipefail
          STORAGE_ACCOUNT="$1"
          BLOB_NAME="$2"
          IMAGE_TAG="$3"

          az login --identity -o none

          mkdir -p /opt/logsentinel
          cd /opt/logsentinel

          az storage blob download \
            --auth-mode login \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name deploy-bundle \
            --name "${BLOB_NAME}" \
            --file bundle.tar.gz

          mkdir -p IaC/nginx frontend/dist
          tar xzf bundle.tar.gz
          rm -f bundle.tar.gz

          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${IMAGE_TAG}|" .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
          SCRIPT

          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @remote-deploy.sh \
            --parameters "${{ vars.AZURE_STORAGE_ACCOUNT }}" "bundle-${{ github.sha }}.tar.gz" "${IMAGE_TAG}"

