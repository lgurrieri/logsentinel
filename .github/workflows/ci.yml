name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

  build:
    name: Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Validate compilation
        working-directory: backend
        run: mvn -q -DskipTests clean compile

      - name: Run tests
        working-directory: backend
        env:
          SPRING_AI_OPENAI_API_KEY: test-key-mock
          SPRING_DATASOURCE_URL: jdbc:tc:postgresql:16:///logsentinel_test
          SPRING_DATASOURCE_USERNAME: logsentinel
          SPRING_DATASOURCE_PASSWORD: logsentinel
        run: mvn -q test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  test-frontend:
    name: Frontend Build & Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install, build and test
        run: cd frontend && npm ci && npm run build && npm test -- --run
