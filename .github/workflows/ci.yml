name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

  build:
    name: Compile & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Validate compilation
        working-directory: backend
        run: mvn -q -DskipTests clean compile

      - name: Run tests
        working-directory: backend
        env:
          SPRING_AI_OPENAI_API_KEY: test-key-mock
          SPRING_DATASOURCE_URL: jdbc:tc:postgresql:16:///logsentinel_test
          SPRING_DATASOURCE_USERNAME: logsentinel
          SPRING_DATASOURCE_PASSWORD: logsentinel
        run: mvn -q test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
