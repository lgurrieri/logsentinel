# Nginx de la demo Azure de LogSentinel -- unico punto de entrada publico (puerto 80).
# Sirve el build estatico del frontend y hace de reverse proxy al backend, que
# nunca se expone directamente (ver docker-compose.prod.yml: backend sin ports:).
#
# Sin TLS hoy (DEBT-006) -- Basic Auth como unica barrera de acceso publico.

server {
    listen 80;
    server_name _;

    auth_basic           "LogSentinel demo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ------------------------------------------------------------------
    # SSE: diagnostico de IA en streaming (US2/US3, DiagnosticStreamController).
    # Sin esto, nginx buferea la respuesta completa antes de enviarla al
    # cliente y el streaming token-a-token se ve "a saltos" en vez de en vivo.
    # `proxy_read_timeout` en 90s da margen sobre el timeout de 60s del
    # SseEmitter del backend.
    # ------------------------------------------------------------------
    location ~ ^/api/v1/incidents/[^/]+/diagnostic/stream$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        chunked_transfer_encoding off;
    }

    # API REST -- resto de endpoints del backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check -- usado por el smoke test del runbook de arranque
    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # Frontend estatico (SPA): fallback a index.html para rutas del router de React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
