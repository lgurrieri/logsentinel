# ===================================================
# LogSentinel - Configuracion de Tests
# ===================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: test-key-mock
      chat:
        options:
          model: gpt-4o
      embedding:
        options:
          model: text-embedding-3-small
