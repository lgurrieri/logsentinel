# ===================================================
# LogSentinel - Configuracion de Tests
# ===================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1
      embedding:
        options:
          model: nomic-embed-text
# Nota: la búsqueda vectorial NO usa el VectorStore autoconfigurado de Spring AI —
# se implementa con Flyway (schema) + query nativa JPA (operador `<=>` de pgvector).
