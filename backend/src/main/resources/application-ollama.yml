# ===================================================
# LogSentinel Backend - Perfil de IA: Ollama (local, por defecto)
# ===================================================
# Activar con SPRING_PROFILES_ACTIVE=<entorno>,ollama
# No requiere API key: los modelos corren localmente (docker-compose service "ollama"
# o una instancia Ollama en localhost:11434).

spring:
  ai:
    model:
      chat: ollama
      embedding: ollama

    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.1
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text
      init:
        pull-model-strategy: when_missing
        embedding:
          additional-models: [nomic-embed-text]

# Nota: la búsqueda vectorial NO usa el VectorStore autoconfigurado de Spring AI —
# se implementa con Flyway (schema) + query nativa JPA (operador `<=>` de pgvector).
# Dimensión de embeddings esperada bajo este perfil: 768 (nomic-embed-text). Cambiar
# de proveedor luego de tener datos persistidos requiere backfill/re-embedding.
