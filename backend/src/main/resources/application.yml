# ===================================================
# LogSentinel Backend - Configuración de Aplicación
# ===================================================

spring:
  application:
    name: logsentinel-backend

  # --- Base de Datos (PostgreSQL + pgvector) ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logsentinel}
    username: ${SPRING_DATASOURCE_USERNAME:logsentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:logsentinel}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # --- Flyway: Migraciones de Base de Datos ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Spring AI: el proveedor (Ollama por defecto / OpenAI opcional) se activa
  #     vía perfil Spring Boot — ver application-ollama.yml / application-openai.yml.
  #     Activar con SPRING_PROFILES_ACTIVE=<entorno>,ollama (o ,openai).
  ai:
    model:
      # LogSentinel solo usa ChatModel/EmbeddingModel. Sin esto, el starter de OpenAI
      # autoconfigura sus otros modelos (audio, imagen, moderación) igual — con
      # matchIfMissing=true — y falla al arrancar sin API key bajo el perfil ollama.
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  # --- Async: Configuración de hilos para SSE ---
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: logsentinel-async-

  # --- MVC Async: timeout del request asíncrono subyacente al SseEmitter (LOG-US3-BE-04) ---
  # Sin este valor explícito, Spring MVC aplica su default implícito de 30s: en producción
  # (Azure VM sin GPU) Ollama supera holgadamente ese tiempo para generar un diagnóstico
  # completo, y Spring abortaba el request con AsyncRequestTimeoutException antes de que
  # StreamDiagnosticService llegara a persistir el diagnóstico consolidado. 180000ms (3 min)
  # cubre el peor caso observado en producción con margen. DiagnosticStreamController
  # inyecta este mismo valor (vía @Value) como timeout del SseEmitter, para que ambos
  # nunca diverjan entre sí.
  mvc:
    async:
      request-timeout: 180000

  # --- Cliente HTTP compartido (RestClient/WebClient) usado por Spring AI para hablar con
  #     Ollama (LOG-US3-BE-04). Spring AI no expone una propiedad de timeout propia para
  #     Ollama: OllamaApi obtiene sus clientes HTTP vía los builders autoconfigurados por
  #     Spring Boot (RestClient.Builder para el chat() bloqueante, WebClient.Builder para
  #     el streamingChat() reactivo), que a su vez consumen estos valores unificados
  #     (spring.http.clients.*, Spring Boot 4.1). Se alinean al mismo timeout que
  #     spring.mvc.async.request-timeout para no introducir un corte prematuro distinto;
  #     aunque el read-timeout del conector reactivo pudiera interpretarse como tiempo-al-
  #     primer-byte en vez de duración total del stream, se opta por el valor conservador.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 180s

# --- LogSentinel: configuración propia de la aplicación ---
logsentinel:
  rag:
    # Cantidad de fragmentos (runbook_chunks) a recuperar por búsqueda semántica (US2).
    top-k: 3
  sandbox:
    # SecuritySandbox (US4): allowlist de comandos base permitidos en scripts de
    # remediación, separados por coma. Cualquier comando fuera de esta lista, o
    # que contenga un metacaracter clásico de inyección Bash (| && $( ` >), es
    # rechazado antes de invocar ProcessBuilder.
    allowlist: echo,ansible-playbook,systemctl
    # Usuario del sistema operativo bajo el cual DEBE correr la JVM para que el
    # sandbox acepte ejecutar cualquier subproceso — nunca 'root'. Coincide con
    # el usuario non-root del stage runtime de backend/Dockerfile (USER appuser).
    executor-user: appuser
    # Shell usado para invocar el script aislado (`{shell} -c "{script}"`).
    shell: bash
    # Tiempo máximo (segundos) que ExecuteRemediationService espera al subproceso
    # aislado antes de que el Watchdog del sandbox lo termine (LOG-US4-BE-02).
    execution-timeout-seconds: 30

# --- Actuator: Endpoints de salud y métricas ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# --- Servidor ---
server:
  port: 8080
  servlet:
    context-path: /
