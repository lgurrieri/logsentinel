# ===================================================
# LogSentinel Backend - Perfil de IA: OpenAI (cloud, opcional)
# ===================================================
# Activar con SPRING_PROFILES_ACTIVE=<entorno>,openai
# Requiere SPRING_AI_OPENAI_API_KEY. Pensado para staging/prod sin GPUs locales.

spring:
  ai:
    model:
      chat: openai
      embedding: openai

    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
          max-tokens: 2048
      embedding:
        options:
          model: text-embedding-3-small

    # --- Spring AI: PGVector Store ---
    # Dimensión 1536 = text-embedding-3-small. Cambiar de proveedor luego de tener datos
    # persistidos requiere backfill/re-embedding, no es un cambio de config en caliente.
    vectorstore:
      pgvector:
        table-name: runbook_chunks
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false
