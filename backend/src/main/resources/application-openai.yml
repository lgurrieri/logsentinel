# ===================================================
# LogSentinel Backend - Perfil de IA: OpenAI (cloud, opcional)
# ===================================================
# Activar con SPRING_PROFILES_ACTIVE=<entorno>,openai
# Requiere SPRING_AI_OPENAI_API_KEY. Pensado para staging/prod sin GPUs locales.

spring:
  ai:
    model:
      chat: openai
      embedding: openai

    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
          max-tokens: 2048
      embedding:
        options:
          model: text-embedding-3-small

# Nota: la búsqueda vectorial NO usa el VectorStore autoconfigurado de Spring AI —
# se implementa con Flyway (schema) + query nativa JPA (operador `<=>` de pgvector).
# Dimensión de embeddings esperada bajo este perfil: 1536 (text-embedding-3-small). Cambiar
# de proveedor luego de tener datos persistidos requiere backfill/re-embedding.
