services:

  # -------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # -------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: logsentinel-db
    environment:
      POSTGRES_DB: logsentinel
      POSTGRES_USER: logsentinel
      POSTGRES_PASSWORD: logsentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsentinel -d logsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------
  # Backend Spring Boot
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logsentinel-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/logsentinel
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
